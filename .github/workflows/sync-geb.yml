name: Sync GEB Inventory

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Fetch GEB inventory
        run: npm run fetch-geb
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Check for data changes
        id: diff
        run: |
          if git diff --quiet src/data/geb-inventory.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "GEB inventory is up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "GEB inventory has changed:"
            git diff --stat src/data/geb-inventory.ts
          fi

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Configure git
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit data sync
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add src/data/geb-inventory.ts
          git commit -m "chore: sync GEB inventory ($(date -u +%Y-%m-%d))"

      - name: Upgrade npm for OIDC trusted publishing
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g npm@11

      - name: Bump version, publish, tag, release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')
          export NEW_VERSION
          echo "Releasing v$NEW_VERSION"

          npm run build
          npm publish --access public --provenance

          git add package.json package-lock.json
          git commit -m "chore: release v$NEW_VERSION (GEB inventory sync)"
          git tag "v$NEW_VERSION"

          git pull --rebase origin main
          git push origin main
          git push origin "v$NEW_VERSION"

          gh release create "v$NEW_VERSION" \
            --title "v$NEW_VERSION" \
            --generate-notes
